{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Levin.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/base.css' %}"> 
    <link rel="icon" href="{% static 'images/Favicon-LN.ico' %}"> 
</head>
<body>



{% include 'app/navbar.html' %}

{% block content %}

{% endblock content %} 

<script src="{% static 'js/base.js' %}">

    /* Create Product Section */
    document.getElementById('productForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const form = e.target;
        const formData = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                },
            });

            if (response.ok) {
                const result = await response.json();
                document.getElementById('resultMessage').innerHTML = 
                    `<div class="alert alert-success">Product created successfully!</div>`;
                form.reset();
            } else {
                const errorData = await response.json();
                let errors = '';
                for (const [field, messages] of Object.entries(errorData.errors)) {
                    errors += `${field}: ${messages.join(', ')}<br>`;
                }
                document.getElementById('resultMessage').innerHTML = 
                    `<div class="alert alert-danger">Errors:<br>${errors}</div>`;
            }
        } catch (error) {
            document.getElementById('resultMessage').innerHTML = 
                `<div class="alert alert-danger">Something went wrong: ${error.message}</div>`;
        }
    });

    /* Edit Modal Section */
    function openEditModal() {
        document.getElementById('editModal').style.display = 'block';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    document.querySelectorAll('.edit-button').forEach(button => {
        button.addEventListener('click', function () {
            const row = this.closest('tr');
            const productId = row.getAttribute('data-id');

            document.getElementById('edit_product_id').value = productId;
            document.getElementById('edit_prod_name').value = row.cells[0].innerText;
            document.getElementById('edit_description').value = row.cells[2].innerText;
            document.getElementById('edit_prod_price').value = row.cells[3].innerText.replace('₱', '').trim();

            document.getElementById('editProductForm').action = `/product/edit/${productId}/`;

            openEditModal();
        });
    });

    // Handle Form Submission for Edit
    document.getElementById('editProductForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const formData = new FormData(this);

        const actionUrl = document.getElementById('editProductForm').action;

        fetch(actionUrl, {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Product updated successfully!');
                location.reload();
            } else {
                alert('Failed to update product.');
            }
        })
        .catch(error => console.error('Error:', error));
    });

    // Delete Button Functionality
    document.querySelectorAll('.delete-button').forEach(button => {
        button.addEventListener('click', function () {
            const row = this.closest('tr');
            const productId = row.getAttribute('data-id');

            if (confirm('Are you sure you want to delete this product?')) {
                fetch(`/delete-product/${productId}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}', 
                        'Content-Type': 'application/json'
                    }
                })
                    .then(response => {
                        if (response.ok) {
                            alert('Product deleted successfully!');
                            row.remove(); 
                        } else {
                            alert('Failed to delete product.');
                        }
                    })
                    .catch(error => console.error('Error:', error));
            }
        });
    });
    
</script> 
<script src='https://kit.fontawesome.com/a076d05399.js' crossorigin='anonymous'></script>
</body>
</html>
