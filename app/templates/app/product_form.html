{% extends 'app/base.html' %}
{% include 'app/navbar.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/product_form.css' %}">

<div class="form-container">
    <form id="productForm" method="post" enctype="multipart/form-data">
        <div class="header-container">
            <h1>Create Product</h1>
        </div>
        {% csrf_token %}    
        <div class="form-group" id="product-form">
            <label for="id_prod_name">Product Name</label>
            <input type="text" name="prod_name" id="id_prod_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="id_description">Description</label>
            <textarea name="description" id="id_description" class="form-control" rows="7" cols="50" style="resize: none;" required></textarea>
        </div>
        <div class="form-group">
            <label for="id_prod_price">Price</label>
            <input type="number" step="0.01" name="prod_price" id="id_prod_price" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="id_prod_photo">Photo</label>
            <input type="file" name="prod_photo" id="id_prod_photo" class="form-control" >
        </div>
        <div class="form-group">
            <label for="id_category_prod">Category</label>
            {{ form.category_prod }}
            <button type="button" id="toggleNewCategory" class="btn btn-secondary">+ Add New Category</button>
        </div>
        <div class="form-group">
            <label for="id_inventory_prod">Inventory</label>
            {{ form.inventory_prod }}
            <button type="button" id="toggleNewInventory" class="btn btn-secondary">+ Add New Inventory</button>
        </div>
        
        <button type="submit" class="btn btn-primary">Save Product</button>
    </form>

    <div id="newContainer"class="create-new-container" style="display: none;">
        <!-- Category Form -->
        <div id="newCategoryForm" style="display: none;">
            <h4>Create New Category</h4>
            <form id="categoryForm" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="new_category_name">Category Name</label>
                    <input type="text" name="category_name" id="new_category_name" class="form-control" required>
                    <button type="submit" class="btn btn-success">Save New Category</button>
                </div>
            </form>
        </div>

        <div id="categoryMessage"></div>

        <!-- Inventory Form -->
        <div id="newInventoryForm" style="display: none;">
            <h4>Create New Inventory</h4>
            <form id="inventoryForm" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="new_inventory_quantity">Quantity</label>
                    <input type="number" name="quantity" id="new_inventory_quantity" class="form-control" required>
                    <button type="submit" class="btn btn-success">Save New Inventory</button>
                </div>
            </form>
        </div>

        <div id="inventoryMessage"></div>
    </div>
</div>

<script>

    const newContainer = document.getElementById('newContainer');
    const categoryForm = document.getElementById('newCategoryForm');
    const inventoryForm = document.getElementById('newInventoryForm');

    function updateContainerVisibility() {
        if (categoryForm.style.display === 'block' || inventoryForm.style.display === 'block') {
            newContainer.style.display = 'block';
        } else {
            newContainer.style.display = 'none';
        }
    }

    // Toggle Category Form
    document.getElementById('toggleNewCategory').addEventListener('click', function () {
        categoryForm.style.display = categoryForm.style.display === 'none' ? 'block' : 'none';
        updateContainerVisibility();
    });

    // Toggle Inventory Form
    document.getElementById('toggleNewInventory').addEventListener('click', function () {
        inventoryForm.style.display = inventoryForm.style.display === 'none' ? 'block' : 'none';
        updateContainerVisibility();
    });
    
    document.getElementById('categoryForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 

        const form = e.target;
        const formData = new FormData(form);

        try {
            const response = await fetch("{% url 'create_category' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                },
            });

            if (response.ok) {
                const result = await response.json();
                document.getElementById('categoryMessage').innerHTML = 
                    `<div class="alert alert-success">New category added: ${result.name}</div>`;

                // Update category dropdown
                const categoryDropdown = document.getElementById('id_category_prod');
                const newOption = document.createElement('option');
                newOption.value = result.id;
                newOption.textContent = result.name;
                categoryDropdown.appendChild(newOption);

                form.reset();
            } else {
                const errorData = await response.json();
                document.getElementById('categoryMessage').innerHTML = 
                    `<div class="alert alert-danger">Error: ${errorData.error}</div>`;
            }
        } catch (error) {
            document.getElementById('categoryMessage').innerHTML = 
                `<div class="alert alert-danger">Something went wrong: ${error.message}</div>`;
        }
    });

    // Handle Inventory Submission
    document.getElementById('inventoryForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        const form = e.target;
        const formData = new FormData(form);

        try {
            const response = await fetch("{% url 'create_inventory' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                },
            });

            if (response.ok) {
                const result = await response.json();
                document.getElementById('inventoryMessage').innerHTML = 
                    `<div class="alert alert-success">New inventory added: Quantity ${result.quantity}</div>`;

                // Update inventory dropdown
                const inventoryDropdown = document.getElementById('id_inventory_prod');
                const newOption = document.createElement('option');
                newOption.value = result.id;
                newOption.textContent = `Inventory ID: ${result.id}, Quantity: ${result.quantity}`;
                inventoryDropdown.appendChild(newOption);

                form.reset();
            } else {
                const errorData = await response.json();
                document.getElementById('inventoryMessage').innerHTML = 
                    `<div class="alert alert-danger">Error: ${errorData.error}</div>`;
            }
        } catch (error) {
            document.getElementById('inventoryMessage').innerHTML = 
                `<div class="alert alert-danger">Something went wrong: ${error.message}</div>`;
        }
    });

</script>

{% endblock content %}
