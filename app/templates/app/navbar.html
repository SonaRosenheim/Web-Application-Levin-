{% load static %}
<link rel="stylesheet" href="{% static 'css/navbar.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>

<header id="header" class="header">
  <div class="nav-logo">
    <a href="{% url 'home' %}" class="navbrand"><h1>Levin<span>.</span></h1></a> 
  </div>    

  <input type="checkbox" id="check">
  <label for="check" class="check-btn">
      <i class="fas fa-bars"></i>
  </label>

  <div class="nav-link">
    <nav class="navbar">
      <a href="{% url 'home' %}"><ul>Home</ul></a>
      <a href="#about-us"><ul>About Us</ul></a>
      <a href="{% url 'store' %}"><ul>Store</ul></a>
      {% if user.is_authenticated %}
        <a href="{% url 'user-profile' %}"><ul>{{ user.first_name }}</ul></a>
      {% else %}
        <a href="{% url 'login' %}"><ul>Login</ul></a>
      {% endif %}
      <a class="cart-link" href="{% url 'user-cart' %}"><i class="fa fa-shopping-cart" aria-hidden="true"></i></a>
      <div class="animation start-home"></div>
    </nav>
  </div>
</header>

{% block content %}

{% endblock content %}
